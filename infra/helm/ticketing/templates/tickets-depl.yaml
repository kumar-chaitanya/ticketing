apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-depl
spec:
  replicas: {{ .Values.tickets.replicas }}
  selector:
    matchLabels:
      app: tickets
  template:
    metadata:
      labels:
        app: tickets
    spec:
      containers:
        - name: tickets
          image: {{ .Values.global.imageRegistry }}/{{ .Values.tickets.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: http://nats-srv:{{ .Values.nats.clientPort }}
            - name: NATS_CLUSTER_ID
              value: {{ .Values.nats.clusterId }}
            - name: MONGO_URI
              value: {{ .Values.tickets.mongoUri | quote }}
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-srv
spec:
  selector:
    app: tickets
  ports:
    - name: tickets
      protocol: TCP
      port: {{ .Values.global.servicePort }}
      targetPort: {{ .Values.global.servicePort }}
