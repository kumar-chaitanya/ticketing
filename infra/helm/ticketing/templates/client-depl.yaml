apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-depl
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: {{ .Values.global.imageRegistry }}/{{ .Values.client.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
---
apiVersion: v1
kind: Service
metadata:
  name: client-srv
spec:
  selector:
    app: client
  ports:
    - name: client
      protocol: TCP
      port: {{ .Values.global.servicePort }}
      targetPort: {{ .Values.global.servicePort }}
